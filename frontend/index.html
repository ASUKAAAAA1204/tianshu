<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>梁平数字空域 · 运行基础底座</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>.layer-panel{margin-top:14px;border-top:1px solid #26364d;padding-top:12px}.subhead{font-size:11px;color:#8295af;margin-bottom:8px}.layer-row{display:flex;align-items:center;gap:7px;font-size:11px;color:#a8b8cc;padding:5px 0}.layer-row small{margin-left:auto;color:#71839d}.layer-swatch{width:8px;height:8px;border-radius:2px}.layer-swatch.operable{background:#3f8fd3}.layer-swatch.restricted{background:#d89b52}.result-panel{margin-top:18px}.result-empty{color:#71839d;font-size:12px;padding:14px 0}.result-summary,.result-block,.route-result{padding:11px 13px;margin-bottom:8px;background:#111e30;border:1px solid #263b52;display:flex;gap:12px;align-items:center;font-size:12px}.result-summary.pass{color:#70e0b2;border-color:#27745b}.result-summary.warning,.result-block.soft{color:#ffca82;border-color:#80602b}.result-summary.blocked,.result-block.hard{color:#ff9b91;border-color:#793d39}.result-block{justify-content:flex-start}.result-block small{margin-left:auto;color:#8194aa}.route-result{flex-direction:column;align-items:flex-start;color:#a8c7e5}</style>
    <style>.mission-actions{display:flex;align-items:center;gap:5px}.mission-actions button{font-size:10px;color:#a9c9e9;background:#162e48;border:1px solid #315275;border-radius:2px;padding:3px 6px;cursor:pointer}.mission-actions .state{margin-left:3px}</style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="eyebrow">LIANGPING LOW-ALTITUDE OPERATIONS</div>
        <h1>梁平县域数字空域与低空运行智能服务平台</h1>
      </div>
      <div class="topbar-meta"><span class="status-dot"></span> 演示环境 · 离线可用</div>
    </header>
    <main class="shell">
      <section class="metrics" id="metrics"></section>
      <section class="workspace">
        <div class="panel map-panel">
          <div class="panel-head"><div><span class="section-kicker">01 / 空域态势</span><h2>四维空域运行视图</h2></div><span class="badge badge-green">数据正常</span></div>
          <div class="map-canvas" id="mapCanvas" aria-label="空域示意图"></div>
          <div class="legend"><span><i class="legend-box blue"></i>可运行空域</span><span><i class="legend-box amber"></i>限制区</span><span><i class="legend-box red"></i>冲突预警</span></div>
          <div class="layer-panel"><div class="subhead">图层控制</div><div id="layerList"></div></div>
        </div>
        <div class="panel mission-panel">
          <div class="panel-head"><div><span class="section-kicker">02 / 运行任务</span><h2>任务与航线</h2></div><button class="primary" id="newMission">新建任务</button></div>
          <div id="missionList" class="mission-list"></div>
        </div>
      </section>
      <section class="panel result-panel"><div class="panel-head"><div><span class="section-kicker">05 / 规则与航线结果</span><h2>任务处置结果</h2></div><span id="resultBadge" class="badge">等待操作</span></div><div id="resultContent" class="result-empty">选择任务后点击“检查”或“航线”，结果将在此处保留。</div></section>
      <section class="lower-grid">
        <div class="panel"><div class="panel-head"><div><span class="section-kicker">03 / 规则引擎</span><h2>当前生效规则</h2></div><span class="badge">规则优先</span></div><div id="ruleList" class="rule-list"></div></div>
        <div class="panel"><div class="panel-head"><div><span class="section-kicker">04 / 设施与飞行器</span><h2>资源状态</h2></div><span class="badge badge-blue">实时模拟</span></div><div id="vehicleList" class="vehicle-list"></div></div>
      </section>
      <footer class="footer"><span id="health">正在检查服务...</span><span>版本 0.2.0 · Sprint 1</span></footer>
    </main>
    <dialog id="missionDialog"><form id="missionForm"><div class="dialog-head"><h2>新建运行任务</h2><button type="button" id="closeDialog">×</button></div><div class="form-grid"><label>任务编号<input name="id" value="MS-20260915-004" required></label><label>任务名称<input name="name" value="新建基础运行任务" required></label><label>飞行器<select name="vehicle_id" id="vehicleSelect"></select></label><label>航线名称<input name="route_name" value="R-新建-01" required></label><label>起点经度<input name="start_lng" value="107.742" required></label><label>起点纬度<input name="start_lat" value="30.642" required></label><label>终点经度<input name="end_lng" value="107.792" required></label><label>终点纬度<input name="end_lat" value="30.659" required></label><label>计划高度（米）<input name="planned_altitude" type="number" min="20" max="1200" value="120" required></label></div><div id="formMessage" class="form-message"></div><div class="dialog-actions"><button type="button" id="cancelDialog">取消</button><button class="primary" type="submit">创建并保存</button></div></form></dialog>
    <script src="/app.js" defer></script>
  </body>
</html>
