services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: liangping-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-liangping}
      POSTGRES_USER: ${POSTGRES_USER:-liangping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - liangping_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  liangping_postgres_data:
